version: '3.8'

services:
  web:
    container_name: roma-web
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      # Uncomment and configure if using Postgres in Docker Compose
      # - DATABASE_URL=postgres://user:password@db:5432/roma
    restart: always

